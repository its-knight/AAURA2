name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.2.1.stable ~/.local/share/godot/export_templates/4.2.1.stable

      - name: Export APK
        run: |
          mkdir -p build
          PRESET_NAME=$(grep -oP 'name="\K[^"]+' export_presets.cfg | head -n 1)
          godot --headless --export-debug "$PRESET_NAME" build/game.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/game.apk
