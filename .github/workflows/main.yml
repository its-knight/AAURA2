name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download & Setup Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          wget https://github.com/godotengine/godot/releases/download/4.2.1-stable/Godot_v4.2.1-stable_export_templates.tpz
          unzip Godot_v4.2.1-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/4.2.1.stable

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Aura.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/Aura.apk
